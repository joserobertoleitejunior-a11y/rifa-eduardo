<title>Rifa Cesta de Chocolate</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
  /* Layout: uma tela só — o cartaz preenche a janela, os números são clicáveis em cima da arte,
     o Pix é desenhado dentro da imagem, e a barra de ações flutua embaixo (fora do print). */
  :root {
    --bg: #0c0908;
    --fg: #f6e9d8;
    --fg-muted: #b89b7d;
    --panel: #1d1512;
    --border: #3b2a20;
    --accent: #d61f2a;
    --gold: #f0c04a;
    --gold-ink: #2a1a06;
    --x: #e3141e;
    color-scheme: dark;
  }
  @media (prefers-color-scheme: light) {
    :root:not([data-theme="dark"]) {
      --bg: #0c0908; --fg: #f6e9d8; --fg-muted: #b89b7d; --panel: #1d1512; --border: #3b2a20;
      --accent: #d61f2a; --gold: #f0c04a; --gold-ink: #2a1a06; --x: #e3141e; color-scheme: dark;
    }
  }
  :root[data-theme="light"] {
    --bg: #0c0908; --fg: #f6e9d8; --fg-muted: #b89b7d; --panel: #1d1512; --border: #3b2a20;
    --accent: #d61f2a; --gold: #f0c04a; --gold-ink: #2a1a06; --x: #e3141e; color-scheme: dark;
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; overflow: hidden; background: var(--bg); color: var(--fg);
    font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    padding-block: 8px;
  }

  #board { position: relative; flex: none; border-radius: 10px; overflow: hidden; box-shadow: 0 20px 50px -20px rgba(0,0,0,.9); }
  #board img.flyer { display: block; width: 100%; height: 100%; }

  /* hotspots em cima dos números impressos */
  .hot {
    position: absolute; background: transparent; border: 0; padding: 0; margin: 0; cursor: pointer;
    border-radius: 6px; -webkit-tap-highlight-color: transparent;
  }
  .hot:focus-visible { outline: 3px solid var(--gold); outline-offset: -2px; }
  .hot .x { position: absolute; inset: 0; display: none; }
  .hot .x::before, .hot .x::after {
    content: ""; position: absolute; left: 50%; top: 50%; width: 118%; height: 16%;
    background: var(--x); border-radius: 999px; box-shadow: 0 0 0 2px rgba(255,255,255,.85);
    transform-origin: center;
  }
  .hot .x::before { transform: translate(-50%,-50%) rotate(45deg); }
  .hot .x::after  { transform: translate(-50%,-50%) rotate(-45deg); }
  .hot.sold .x { display: block; }
  .hot.pop .x { animation: stamp .3s cubic-bezier(.34,1.56,.64,1); }
  @keyframes stamp { 0% { transform: scale(1.8); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }

  /* badge do Pix desenhado dentro da arte, sobre a faixa inferior */
  .pix {
    position: absolute; left: 2%; right: 21%; top: 93.2%; bottom: 1.4%;
    display: flex; align-items: center; gap: 2.2%; padding: 0 2.4%;
    background: linear-gradient(180deg, #e82733, #b3101c);
    border: 2px solid var(--gold); border-radius: 999px; box-shadow: 0 6px 16px -6px rgba(0,0,0,.8);
    color: #fff; font-weight: 800; white-space: nowrap; overflow: hidden;
    font-size: clamp(8px, 2.3cqw, 26px);
    container-type: inline-size;
  }
  .pix .tag {
    background: var(--gold); color: var(--gold-ink); border-radius: 999px; padding: 0.25em 0.9em;
    font-size: 0.78em; letter-spacing: 0.08em; text-transform: uppercase; flex: none;
  }
  .pix .key { font-family: ui-monospace, Menlo, monospace; font-size: 1.05em; letter-spacing: 0.02em; }
  .pix .name { font-weight: 600; opacity: .95; font-size: 0.9em; }
  .pix .sep { opacity: .7; }

  /* barra de ações — fora do #board, não entra no print */
  .bar {
    flex: none; display: flex; gap: 8px; align-items: center; justify-content: center; flex-wrap: wrap;
  }
  .btn {
    display: inline-flex; align-items: center; gap: 8px; border: 1px solid var(--border);
    background: var(--panel); color: var(--fg); font-weight: 700; font-size: 13px;
    padding: 11px 15px; border-radius: 999px; cursor: pointer; text-decoration: none;
  }
  .btn:active { transform: translateY(1px); }
  .btn-primary { background: linear-gradient(180deg, #e82733, #b3101c); border-color: #7d0b14; color: #fff; }
  .btn-whats { background: linear-gradient(180deg, #2fdb74, #1fab57); border-color: #16813f; color: #06310f; }
  .btn-gold { background: var(--gold); border-color: #b8841a; color: var(--gold-ink); }
  .count { font-size: 12.5px; color: var(--fg-muted); font-variant-numeric: tabular-nums; }
  .count b { color: var(--gold); }

  .orgpanel {
    display: none; gap: 8px; align-items: center; background: var(--panel); border: 1px solid var(--border);
    padding: 8px; border-radius: 14px;
  }
  .orgpanel.open { display: flex; }
  .orgpanel input {
    min-width: 0; width: 170px; border: 1px solid var(--border); border-radius: 10px; padding: 9px 10px;
    font-size: 14px; background: var(--bg); color: var(--fg);
  }

  .toast {
    position: fixed; left: 50%; top: calc(14px + env(safe-area-inset-top, 0px));
    transform: translate(-50%, -10px); background: var(--gold); color: var(--gold-ink);
    padding: 10px 18px; border-radius: 999px; font-size: 13px; font-weight: 700;
    opacity: 0; pointer-events: none; transition: opacity .2s ease, transform .2s ease; z-index: 50;
    max-width: calc(100% - 32px); text-align: center;
  }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }

  .overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,.85); display: none;
    align-items: center; justify-content: center; z-index: 60;
    padding: 16px;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
  }
  .overlay.open { display: flex; }
  .overlay-card {
    background: var(--panel); border: 1px solid var(--border); border-radius: 18px; padding: 12px;
    max-width: 440px; width: 100%; max-height: 100%; display: flex; flex-direction: column; gap: 10px;
  }
  .overlay-scroll { overflow: auto; min-height: 0; }
  .overlay-card img { width: 100%; border-radius: 10px; display: block; }
  .overlay-hint { font-size: 13px; color: var(--fg-muted); text-align: center; margin: 0; }
  .overlay-close {
    border: 1px solid var(--border); background: none; color: var(--fg); font-weight: 700;
    font-size: 13px; padding: 11px; border-radius: 12px; cursor: pointer;
  }

  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; animation: none !important; }
  }
</style>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script>
(function () {
  "use strict";

  // Geometria medida no cartaz original (1199 x 1312 px).
  var IMG_W = 1199, IMG_H = 1312;
  var COL_X0 = 27, COL_PITCH = 70.5, CELL_W = 66;
  var ROW_Y = [758, 804, 847, 891, 934, 978, 1021, 1065, 1108, 1152], CELL_H = 40;

  var SENHA_ORGANIZADOR = "eduardo10";
  var KEY_VENDIDOS = "rifa-eduardo-vendidos";
  var KEY_ORGANIZADOR = "rifa-eduardo-organizador";

  function lerVendidos() {
    try { var raw = localStorage.getItem(KEY_VENDIDOS); return raw ? new Set(JSON.parse(raw)) : new Set(); }
    catch (e) { return new Set(); }
  }
  function salvarVendidos(set) {
    try { localStorage.setItem(KEY_VENDIDOS, JSON.stringify(Array.from(set))); } catch (e) {}
  }
  function ehOrganizador() {
    try { return localStorage.getItem(KEY_ORGANIZADOR) === "1"; } catch (e) { return false; }
  }
  function definirOrganizador(v) {
    try { v ? localStorage.setItem(KEY_ORGANIZADOR, "1") : localStorage.removeItem(KEY_ORGANIZADOR); } catch (e) {}
  }

  var vendidos = lerVendidos();
  var organizador = ehOrganizador();

  var board = document.getElementById("board");
  var hots = document.getElementById("hots");
  var soldCount = document.getElementById("soldCount");
  var toast = document.getElementById("toast");
  var orgToggleBtn = document.getElementById("orgToggleBtn");
  var orgExitBtn = document.getElementById("orgExitBtn");
  var orgPanel = document.getElementById("orgPanel");
  var orgPassword = document.getElementById("orgPassword");
  var orgSubmitBtn = document.getElementById("orgSubmitBtn");

  var toastTimer = null;
  function mostrarToast(msg) {
    toast.textContent = msg;
    toast.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { toast.classList.remove("show"); }, 2200);
  }

  // Encaixa o cartaz na janela sem rolar, sobrando espaço pra barra.
  function ajustarTamanho() {
    var bar = document.querySelector(".bar");
    var extra = (bar ? bar.offsetHeight : 0) + (orgPanel.classList.contains("open") ? orgPanel.offsetHeight + 10 : 0) + 30;
    var vw = document.documentElement.clientWidth - 32;
    var vh = document.documentElement.clientHeight - extra;
    var ratio = IMG_W / IMG_H;
    var w = Math.min(vw, vh * ratio);
    var h = w / ratio;
    board.style.width = Math.floor(w) + "px";
    board.style.height = Math.floor(h) + "px";
  }
  window.addEventListener("resize", ajustarTamanho);

  function pct(v, total) { return (v / total * 100).toFixed(3) + "%"; }

  function construirHotspots() {
    var frag = document.createDocumentFragment();
    for (var r = 0; r < 10; r++) {
      for (var c = 0; c < 10; c++) {
        var n = r * 10 + c + 1;
        var b = document.createElement("button");
        b.type = "button";
        b.className = "hot" + (vendidos.has(n) ? " sold" : "");
        b.dataset.n = String(n);
        b.style.left = pct(COL_X0 + c * COL_PITCH, IMG_W);
        b.style.top = pct(ROW_Y[r], IMG_H);
        b.style.width = pct(CELL_W, IMG_W);
        b.style.height = pct(CELL_H, IMG_H);
        b.setAttribute("aria-label", "Número " + n + (vendidos.has(n) ? ", vendido" : ", disponível"));
        var x = document.createElement("span");
        x.className = "x";
        b.appendChild(x);
        b.addEventListener("click", aoClicar);
        frag.appendChild(b);
      }
    }
    hots.appendChild(frag);
  }

  function aoClicar() {
    var n = parseInt(this.dataset.n, 10);
    if (!organizador) { mostrarToast("Só o organizador pode marcar números."); return; }
    var el = this;
    if (vendidos.has(n)) {
      vendidos.delete(n);
      el.classList.remove("sold");
    } else {
      vendidos.add(n);
      el.classList.add("sold", "pop");
      setTimeout(function () { el.classList.remove("pop"); }, 320);
    }
    salvarVendidos(vendidos);
    el.setAttribute("aria-label", "Número " + n + (vendidos.has(n) ? ", vendido" : ", disponível"));
    atualizarContagem();
  }

  function atualizarContagem() { soldCount.textContent = String(vendidos.size); }

  function atualizarVisualOrganizador() {
    orgToggleBtn.hidden = organizador;
    orgExitBtn.hidden = !organizador;
    if (organizador) orgPanel.classList.remove("open");
    ajustarTamanho();
  }

  orgToggleBtn.addEventListener("click", function () {
    orgPanel.classList.toggle("open");
    ajustarTamanho();
    if (orgPanel.classList.contains("open")) orgPassword.focus();
  });
  orgSubmitBtn.addEventListener("click", entrar);
  orgPassword.addEventListener("keydown", function (e) { if (e.key === "Enter") entrar(); });
  function entrar() {
    if (orgPassword.value === SENHA_ORGANIZADOR) {
      organizador = true; definirOrganizador(true); orgPassword.value = "";
      atualizarVisualOrganizador();
      mostrarToast("Modo organizador ativado. Toque nos números pra marcar.");
    } else {
      mostrarToast("Senha incorreta.");
    }
  }
  orgExitBtn.addEventListener("click", function () {
    organizador = false; definirOrganizador(false); atualizarVisualOrganizador();
  });

  document.getElementById("copyBtn").addEventListener("click", function () {
    var texto = "15976009764";
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(texto)
        .then(function () { mostrarToast("Chave Pix copiada: " + texto); })
        .catch(function () { mostrarToast("Pix: " + texto); });
    } else {
      mostrarToast("Pix: " + texto);
    }
  });

  var textoWhats = "Participa da minha Rifa Solidária! 🍫 Cesta de Chocolate por R$ 10,00 o número. " +
    "Pix: 15976009764 (Eduardo Ayres). Me chama o número que você quer!";
  document.getElementById("whatsBtn").addEventListener("click", function () {
    var btn = this;
    btn.disabled = true;
    mostrarToast("Gerando o print...");
    var link = "https://wa.me/?text=" + encodeURIComponent(textoWhats);
    html2canvas(board, { backgroundColor: null, scale: 2, useCORS: true })
      .then(function (canvas) {
        return new Promise(function (res) { canvas.toBlob(res, "image/png"); });
      })
      .then(function (blob) {
        var file = new File([blob], "rifa-eduardo.png", { type: "image/png" });
        if (navigator.canShare && navigator.canShare({ files: [file] })) {
          return navigator.share({ files: [file], text: textoWhats });
        }
        window.open(link, "_blank");
        mostrarToast("Este navegador não anexa a imagem. Use 'Tirar print' e anexe no WhatsApp.");
      })
      .catch(function (e) {
        if (e && e.name === "AbortError") return;
        window.open(link, "_blank");
        mostrarToast("Não deu pra anexar o print. Use 'Tirar print' e anexe no WhatsApp.");
      })
      .then(function () { btn.disabled = false; });
  });

  var printOverlay = document.getElementById("printOverlay");
  var printImg = document.getElementById("printImg");
  var printHint = document.getElementById("printHint");
  document.getElementById("printBtn").addEventListener("click", function () {
    printOverlay.classList.add("open");
    printImg.removeAttribute("src");
    printHint.textContent = "Gerando a imagem...";
    if (typeof html2canvas !== "function") {
      printHint.textContent = "Não deu pra gerar a imagem agora. Tenta de novo."; return;
    }
    html2canvas(board, { backgroundColor: null, scale: 3, useCORS: true })
      .then(function (canvas) {
        printImg.src = canvas.toDataURL("image/png");
        printHint.textContent = "Toque e segure a imagem pra salvar (ou clique com o botão direito no computador).";
      })
      .catch(function () { printHint.textContent = "Não deu pra gerar a imagem agora. Tenta de novo."; });
  });
  document.getElementById("printClose").addEventListener("click", function () { printOverlay.classList.remove("open"); });
  printOverlay.addEventListener("click", function (e) { if (e.target === printOverlay) printOverlay.classList.remove("open"); });

  construirHotspots();
  atualizarContagem();
  atualizarVisualOrganizador();
  ajustarTamanho();
  window.addEventListener("load", ajustarTamanho);
})();
</script>
